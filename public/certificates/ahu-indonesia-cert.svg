  <rect x="10" y="10" width="980" height="680" fill="url(#idBg)" stroke="#A1A1AA" stroke-width="2" rx="6" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#B91C1C" stroke-width="2" />
  <rect x="32" y="32" width="936" height="636" fill="none" stroke="#27272A" stroke-width="1" />

  <g transform="translate(500, 75)" text-anchor="middle">
