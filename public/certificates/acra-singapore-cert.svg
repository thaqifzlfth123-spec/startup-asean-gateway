<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24" />
      <stop offset="100%" stop-color="#A51016" />
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="980" height="680" fill="url(#sgBg)" stroke="#CBD5E1" stroke-width="2" rx="6" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#ED1C24" stroke-width="2" />
  <rect x="32" y="32" width="936" height="636" fill="none" stroke="#0F172A" stroke-width="1" />

  <!-- ACRA Singapore Header -->
  <g transform="translate(500, 70)" text-anchor="middle">
    <!-- Red SG Crest Symbol -->
    <circle cx="0" cy="15" r="26" fill="url(#redGrad)" />
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">SG</text>

    <text x="0" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="2">
      ACCOUNTING AND CORPORATE REGULATORY AUTHORITY
    </text>
    <text x="0" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ED1C24" letter-spacing="1.5">
      SINGAPORE (ACRA) • BIZFILE+ ONLINE REGISTRY
    </text>

    <text x="0" y="115" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" fill="#0F172A">
      CERTIFICATE OF GOOD STANDING &amp; BUSINESS PROFILE
    </text>
    <text x="0" y="132" font-family="Arial, sans-serif" font-size="11" fill="#64748B">
      Issued under the Companies Act (Cap. 50) of the Republic of Singapore
    </text>
  </g>

  <line x1="150" y1="220" x2="850" y2="220" stroke="#ED1C24" stroke-width="1.5" />

  <!-- Company Summary Block -->
  <g transform="translate(500, 255)" text-anchor="middle">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#475569">
      This is to certify that the undermentioned private company limited by shares is duly incorporated:
    </text>
    
    <rect x="-350" y="15" width="700" height="42" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" rx="4" />
    <text x="0" y="43" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F172A">
      PAYNEXA GLOBAL PTE. LTD.
    </text>

    <text x="0" y="82" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      Unique Entity Number (UEN):
    </text>
    <text x="0" y="104" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#ED1C24" letter-spacing="2">
      202339842M
    </text>
  </g>

  <!-- Legal Breakdown -->
  <g transform="translate(100, 395)" font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="0" y="0">
      Incorporation Date: <tspan font-weight="bold" fill="#0F172A">08 November 2023</tspan> | Status: <tspan font-weight="bold" fill="#16A34A">LIVE / IN GOOD STANDING</tspan>
    </text>
    <text x="0" y="22">
      Registered Office Address: <tspan font-weight="bold">71 Ayer Rajah Crescent, #04-12, LaunchPad @ one-north, Singapore 139951</tspan>
    </text>
  </g>

  <!-- Box for Directors & Scope -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="560" height="130" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="6" />
    <path d="M 0,6 Q 0,0 6,0 L 554,0 Q 560,0 560,6 L 560,26 L 0,26 Z" fill="#F8FAFC" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">
      ACRA OFFICIAL CORPORATE STRUCTURE &amp; ECOSYSTEM DATA
    </text>

    <text x="14" y="46" font-family="Arial, sans-serif" font-size="11" fill="#334155">
      <tspan font-weight="bold" fill="#0F172A">Directors / Key Executives:</tspan> Marcus Chen (Managing Director) | Nurul Huda binti Ismail (CTO)
    </text>
    <text x="14" y="68" font-family="Arial, sans-serif" font-size="11" fill="#334155">
      <tspan font-weight="bold" fill="#0F172A">Primary SSIC Code:</tspan> 62019 - Development of other software and programming activities (FinTech)
    </text>
    <text x="14" y="90" font-family="Arial, sans-serif" font-size="11" fill="#334155">
      <tspan font-weight="bold" fill="#0F172A">Secondary SSIC Code:</tspan> 64994 - Digital Cross-Border Settlement &amp; Financial API Rail Operations
    </text>
    <text x="14" y="112" font-family="Arial, sans-serif" font-size="10.5" fill="#64748B">
      <tspan font-weight="bold">Issued Capital:</tspan> SGD 150,000.00 | <tspan font-weight="bold">Audit Exemption:</tspan> Small Entity Qualified
    </text>
  </g>

  <!-- ACRA Digital Stamp -->
  <g transform="translate(720, 460)">
    <circle cx="65" cy="55" r="50" fill="#FFF" stroke="#ED1C24" stroke-width="3" />
    <circle cx="65" cy="55" r="42" fill="none" stroke="#ED1C24" stroke-width="1" stroke-dasharray="4 2" />
    <text x="65" y="42" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ED1C24" text-anchor="middle">
      ACRA SINGAPORE
    </text>
    <text x="65" y="56" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">
      AUTHENTICATED
    </text>
    <text x="65" y="68" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#64748B" text-anchor="middle">
      ELECTRONIC SEAL
    </text>
    <text x="65" y="80" font-family="'Courier New', monospace" font-size="7" fill="#ED1C24" text-anchor="middle">
      REF: ACRA-2023-SG
    </text>
  </g>

  <!-- QR Code -->
  <g transform="translate(860, 465)">
    <rect x="0" y="0" width="70" height="70" fill="#FFF" stroke="#CBD5E1" stroke-width="1" />
    <rect x="6" y="6" width="18" height="18" fill="#0F172A" />
    <rect x="9" y="9" width="12" height="12" fill="#FFF" />
    <rect x="11" y="11" width="8" height="8" fill="#0F172A" />
    <rect x="46" y="6" width="18" height="18" fill="#0F172A" />
    <rect x="49" y="9" width="12" height="12" fill="#FFF" />
    <rect x="51" y="11" width="8" height="8" fill="#0F172A" />
    <rect x="6" y="46" width="18" height="18" fill="#0F172A" />
    <rect x="9" y="49" width="12" height="12" fill="#FFF" />
    <rect x="11" y="51" width="8" height="8" fill="#0F172A" />
    <rect x="30" y="14" width="8" height="8" fill="#0F172A" />
    <rect x="32" y="32" width="14" height="14" fill="#0F172A" />
    <rect x="50" y="48" width="12" height="8" fill="#0F172A" />
    <text x="35" y="85" font-family="Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">
      Verify BizFile
    </text>
  </g>

  <!-- Signoff -->
  <g transform="translate(500, 630)" text-anchor="middle" font-family="Arial, sans-serif">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#94A3B8" stroke-width="1" />
    <text x="0" y="15" font-size="12" font-weight="bold" fill="#0F172A">
      ONG KIAN MIN
    </text>
    <text x="0" y="28" font-size="10" fill="#64748B">
      Assistant Registrar of Companies &amp; Businesses, Singapore
    </text>
  </g>
</svg>
