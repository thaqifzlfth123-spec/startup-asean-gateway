<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7" />
      <stop offset="50%" stop-color="#FDFDF9" />
      <stop offset="100%" stop-color="#F7F4EA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="100%" stop-color="#1B4965" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Certificate Paper Background -->
  <rect x="10" y="10" width="980" height="680" fill="url(#bgGrad)" stroke="#B89738" stroke-width="3" rx="8" />
  
  <!-- Outer Ornate Guilloche Border -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#D4AF37" stroke-width="1.5" />
  <rect x="32" y="32" width="936" height="636" fill="none" stroke="#0E2A47" stroke-width="2" stroke-dasharray="10 4" />
  <rect x="40" y="40" width="920" height="620" fill="none" stroke="#B89738" stroke-width="1" />

  <!-- Corner Cornerstones -->
  <g fill="#D4AF37">
    <circle cx="40" cy="40" r="6" />
    <circle cx="960" cy="40" r="6" />
    <circle cx="40" cy="660" r="6" />
    <circle cx="960" cy="660" r="6" />
  </g>

  <!-- Watermark SSM Emblem -->
  <g opacity="0.04" transform="translate(375, 220) scale(2.5)">
    <circle cx="50" cy="50" r="45" fill="#0E2A47" />
    <polygon points="50,15 62,38 85,42 68,60 72,85 50,73 28,85 32,60 15,42 38,38" fill="#FFF" />
  </g>

  <!-- Header Header: JATA NEGARA & SURUHANJAYA SYARIKAT MALAYSIA -->
  <g transform="translate(500, 75)" text-anchor="middle">
    <!-- Stylized Emblem -->
    <circle cx="0" cy="15" r="28" fill="#0E2A47" />
    <circle cx="0" cy="15" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="21" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#FFF" letter-spacing="2">SSM</text>
    
    <text x="0" y="62" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#0E2A47" letter-spacing="2.5">
      SURUHANJAYA SYARIKAT MALAYSIA
    </text>
    <text x="0" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#718096" letter-spacing="1.5">
      COMPANIES COMMISSION OF MALAYSIA (ACT 777)
    </text>

    <!-- Certificate Title -->
    <text x="0" y="112" font-family="'Times New Roman', serif" font-size="23" font-weight="bold" fill="#8C1D40" letter-spacing="1">
      PERAKUAN PEMERBADANAN SYARIKAT SENDIRIAN
    </text>
    <text x="0" y="128" font-family="'Times New Roman', serif" font-size="14" font-style="italic" fill="#2D3748">
      CERTIFICATE OF INCORPORATION OF A PRIVATE COMPANY
    </text>
    <text x="0" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#4A5568">
      [Seksyen 17, Akta Syarikat 2016 / Section 17, Companies Act 2016]
    </text>
  </g>

  <!-- Divider Line with Diamond -->
  <line x1="200" y1="230" x2="800" y2="230" stroke="#D4AF37" stroke-width="1.5" />
  <polygon points="500,226 505,230 500,234 495,230" fill="#8C1D40" />

  <!-- Main Body Declaration -->
  <g transform="translate(500, 260)" text-anchor="middle" font-family="'Times New Roman', serif">
    <text x="0" y="0" font-size="14" fill="#2D3748">
      Dengan ini diperakui bahawa / This is to certify that
    </text>
    
    <!-- Company Name Highlight -->
    <rect x="-350" y="15" width="700" height="42" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1" rx="4" />
    <text x="0" y="42" font-size="22" font-weight="bold" fill="#0E2A47" letter-spacing="1.5">
      ECOLOGIX AI SOLUTIONS SDN. BHD.
    </text>

    <text x="0" y="82" font-size="13" fill="#4A5568">
      Nombor Pendaftaran Syarikat / Company Registration Number:
    </text>
    <text x="0" y="104" font-size="17" font-weight="bold" font-family="'Courier New', monospace" fill="#8C1D40" letter-spacing="2">
      202401048821 (1568212-A)
    </text>
  </g>

  <!-- Legal Narrative Text -->
  <g transform="translate(100, 395)" font-family="'Times New Roman', serif" font-size="12.5" fill="#2D3748">
    <text x="0" y="0">
      telah diperbadankan di bawah Akta Syarikat 2016, pada dan mulai daripada <tspan font-weight="bold" fill="#0E2A47">14 Februari 2024</tspan>, dan bahawa syarikat ini adalah
    </text>
    <text x="0" y="18">
      sebuah <tspan font-weight="bold">syarikat berhad menurut syer</tspan> dan syarikat ini adalah sebuah <tspan font-weight="bold" fill="#8C1D40">Syarikat Sendirian</tspan>.
    </text>
    
    <text x="0" y="45" font-style="italic" fill="#718096" font-size="11.5">
      is incorporated under the Companies Act 2016, and that the company is a company limited by shares and is a private company.
    </text>
  </g>

  <!-- Key Officers & Business Scope Box -->
  <g transform="translate(100, 475)">
    <rect x="0" y="0" width="550" height="110" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" rx="6" />
    
    <!-- Header of box -->
    <path d="M 0,6 Q 0,0 6,0 L 544,0 Q 550,0 550,6 L 550,26 L 0,26 Z" fill="#F1F5F9" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0E2A47">
      PROFIL EKOSISTEM STARTUP ASEAN (SSM REKOD RASMI)
    </text>

    <!-- Details -->
    <text x="14" y="44" font-family="Arial, sans-serif" font-size="10.5" fill="#4A5568">
      <tspan font-weight="bold" fill="#1A202C">Pengasas / Pengarah:</tspan> Ahmad Thaqif bin Zulkifli (CEO) | Elena Tan Li Wei (CTO)
    </text>
    <text x="14" y="64" font-family="Arial, sans-serif" font-size="10.5" fill="#4A5568">
      <tspan font-weight="bold" fill="#1A202C">Sektor / Bidang:</tspan> Artificial Intelligence &amp; Autonomous Supply Chain ESG Optimization
    </text>
    <text x="14" y="84" font-family="Arial, sans-serif" font-size="10.5" fill="#4A5568">
      <tspan font-weight="bold" fill="#1A202C">Alamat Berdaftar:</tspan> Level 14, Mercu 2, KL Eco City, 59200 Kuala Lumpur, Wilayah Persekutuan
    </text>
    <text x="14" y="100" font-family="Arial, sans-serif" font-size="10" fill="#718096">
      <tspan font-weight="bold">Modal Dibenarkan:</tspan> RM 100,000.00 | <tspan font-weight="bold">Status:</tspan> Aktif (Pematuhan Penuh)
    </text>
  </g>

  <!-- Official Gold Seal Stamp -->
  <g transform="translate(730, 480)" filter="url(#shadow)">
    <!-- Scalloped Gold Medallion -->
    <circle cx="65" cy="55" r="50" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="2" />
    <circle cx="65" cy="55" r="44" fill="none" stroke="#AA7C11" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="65" cy="55" r="38" fill="#AA7C11" opacity="0.15" />
    
    <text x="65" y="42" font-family="'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="#664D03" text-anchor="middle" letter-spacing="1">
      MOHOR RASMI
    </text>
    <text x="65" y="56" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#3D2E02" text-anchor="middle">
      SSM MALAYSIA
    </text>
    <text x="65" y="68" font-family="'Times New Roman', serif" font-size="7.5" font-weight="bold" fill="#664D03" text-anchor="middle">
      SEAL OF REGISTRAR
    </text>
    <text x="65" y="78" font-family="'Courier New', monospace" font-size="7" fill="#3D2E02" text-anchor="middle">
      ★ 2024 ★
    </text>

    <!-- Ribbon Tail -->
    <polygon points="45,98 65,88 85,98 85,120 65,108 45,120" fill="#8C1D40" />
    <polygon points="50,98 65,89 80,98 80,116 65,106 50,116" fill="#A3244B" />
  </g>

  <!-- QR Code and Barcode Verification -->
  <g transform="translate(865, 485)">
    <!-- Simulated QR Code -->
    <rect x="0" y="0" width="70" height="70" fill="#FFF" stroke="#CBD5E0" stroke-width="1" />
    <!-- QR Corners -->
    <rect x="6" y="6" width="18" height="18" fill="#0E2A47" />
    <rect x="9" y="9" width="12" height="12" fill="#FFF" />
    <rect x="11" y="11" width="8" height="8" fill="#0E2A47" />
    
    <rect x="46" y="6" width="18" height="18" fill="#0E2A47" />
    <rect x="49" y="9" width="12" height="12" fill="#FFF" />
    <rect x="51" y="11" width="8" height="8" fill="#0E2A47" />
    
    <rect x="6" y="46" width="18" height="18" fill="#0E2A47" />
    <rect x="9" y="49" width="12" height="12" fill="#FFF" />
    <rect x="11" y="51" width="8" height="8" fill="#0E2A47" />
    
    <!-- QR pixels -->
    <rect x="30" y="10" width="6" height="6" fill="#0E2A47" />
    <rect x="32" y="24" width="8" height="4" fill="#0E2A47" />
    <rect x="10" y="32" width="6" height="6" fill="#0E2A47" />
    <rect x="30" y="32" width="12" height="12" fill="#0E2A47" />
    <rect x="48" y="32" width="6" height="6" fill="#0E2A47" />
    <rect x="30" y="50" width="8" height="8" fill="#0E2A47" />
    <rect x="48" y="48" width="14" height="6" fill="#0E2A47" />

    <text x="35" y="85" font-family="Arial, sans-serif" font-size="8" fill="#718096" text-anchor="middle">
      Imbas Kod QR
    </text>
    <text x="35" y="95" font-family="'Courier New', monospace" font-size="7" fill="#A0AEC0" text-anchor="middle">
      SEC-SSM-7F89B2
    </text>
  </g>

  <!-- Signature and Footer Information -->
  <g transform="translate(500, 625)" text-anchor="middle" font-family="'Times New Roman', serif">
    <!-- Registrar signature squiggle -->
    <path d="M -90,-12 C -60,-28 -40,5 -10,-15 C 15,-30 40,0 70,-10 C 90,-15 105,-8 115,-12" fill="none" stroke="#0E2A47" stroke-width="1.8" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#718096" stroke-width="0.75" />
    <text x="0" y="15" font-size="12" font-weight="bold" fill="#0E2A47">
      DATUK NOR AZIMAH ABDUL AZIZ
    </text>
    <text x="0" y="28" font-size="10" font-style="italic" fill="#718096">
      Pendaftar Syarikat Malaysia / Registrar of Companies Malaysia
    </text>
  </g>

  <g transform="translate(100, 645)" font-family="Arial, sans-serif" font-size="8.5" fill="#A0AEC0">
    <text x="0" y="0">Tarikh Cetakan / Printed Date: 14/02/2024</text>
    <text x="0" y="12">Dokumen Dijana Melalui Sistem SSM EzBiz Online Gateway</text>
  </g>

  <g transform="translate(900, 645)" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" fill="#A0AEC0">
    <text x="0" y="0">Halaman 1 daripada 1</text>
    <text x="0" y="12">Inisiatif Startup ASEAN Passport Ready</text>
  </g>
</svg>
